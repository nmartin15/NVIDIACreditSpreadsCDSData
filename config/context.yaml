# Plain-language cards. Every figure keeps its source and date.
cards:
  - date: "2026-07-26"
    title: "NVIDIA's own filing caps customer guarantees at $108.5 billion"
    text: "In the quarterly report for the period ended July 26, 2026, NVIDIA lists $3.5 billion of guarantees on some AI-cloud leases and $105 billion of guarantees for an OpenAI-related campus in Ohio. The total maximum exposure in that table is $108.5 billion. A guarantee means NVIDIA pays if the customer does not. FourWeekMBA wrote up the same table."
    source: "NVIDIA Form 10-Q, quarter ended July 26, 2026"
    url: "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000075/nvda-20260726.htm"
  - date: "2026-07-27"
    title: "NVIDIA was reported to be discussing a $250 billion OpenAI backstop"
    text: "Bloomberg reported that NVIDIA was in talks to guarantee as much as $250 billion so OpenAI could finance a data-center lease. The talks were not a finished deal. On August 14, 2026, the Wall Street Journal reported the amount under discussion had been cut to less than $120 billion."
    source: "Bloomberg, July 27, 2026"
    url: "https://www.bloomberg.com/news/articles/2026-07-26/nvidia-in-talks-on-250-billion-backing-for-openai-hub-wsj-says"
  - date: "2026-11-05"
    title: "AI bonds were paying almost twice the extra yield of other investment-grade bonds"
    text: "BofA figures, reported by MarketWatch, put investment-grade AI bonds about 148 basis points over Treasuries on November 5, 2026. The rest of the investment-grade market was about 77. A basis point is one hundredth of a percentage point, so this is 1.48% versus 0.77% of extra yield."
    source: "BofA data via MarketWatch, November 6, 2026"
    url: "https://www.marketwatch.com/story/data-centers-run-on-debt-that-was-a-problem-for-bonds-this-year-and-its-only-going-to-get-worse-09c03be6"
